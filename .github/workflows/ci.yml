name: ci

on:
  push:
    branches: [main, stable]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Stubbed fetch only; the live tests (npm run test:live) need a real instance and never run here.
      - run: npm test
      - run: npm run build
